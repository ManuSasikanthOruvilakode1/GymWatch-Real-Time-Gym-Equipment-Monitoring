data:
  root: data
  cache_dir: .cache/images
  manifest: artifacts/manifest.csv
  cache_short_side: 384
  session_gap_s: 30
  block_s: 2
  purge_s: 1.0
  val_fraction: 0.15
  test_fraction: 0.15
  seed: 42

model:
  backbone: mobilenetv4_conv_medium.e500_r224_in1k
  pretrained: true          # false = train from random init (no externally trained weights)
  drop_rate: 0.2
  drop_path_rate: 0.1
  image_size: [320, 240]    # height, width (photos are 3:4 portrait)

train:
  epochs: 30
  batch_size: 32
  lr: 0.001
  backbone_lr_mult: 0.1
  weight_decay: 0.05
  warmup_epochs: 2
  label_smoothing: 0.1
  occupancy_loss_weight: 1.0
  equipment_loss_weight: 0.5
  ema_decay: 0.998
  patience: 8
  amp: true
  num_workers: 4
  seed: 42
  output_dir: runs

monitor:
  model_path: models/gymwatch.onnx
  inference_fps: 6
  database: artifacts/events.sqlite
  stream_width: 360
  smoothing:
    ema_alpha: 0.35
    enter_threshold: 0.65
    exit_threshold: 0.35
    min_dwell_s: 1.5
  cameras:
    - id: leg-ext-1
      name: Leg extension
      source: video/2024-07-06 21.53.16.mov
      equipment: leg_extension
      loop: true
    - id: pec-fly-1
      name: Pec fly
      source: video/2024-07-06 22.11.52.mov
      equipment: pec_fly
      loop: true
